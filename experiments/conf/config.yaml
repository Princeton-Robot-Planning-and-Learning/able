hydra:
  run:
    dir: ./logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}

seed: 0
num_cycles: 20
# Evaluation tasks sampled once per seed and used in every cycle. Finite task
# distributions ignore this and evaluate every task.
num_eval_tasks: 6
budgets:
  _target_: able.cycle.CycleBudgets
  # One iteration is one dream for the dreaming learner.
  sleep:
    _target_: able.structs.Budget
    max_iterations: 64
  # One iteration is one query. Dreams imagine the same queries. Robots without
  # an information gatherer (the two-link arm's) ask nothing.
  information_gathering:
    _target_: able.structs.Budget
    max_iterations: 1
  # One iteration is one executed task.
  execution:
    _target_: able.structs.Budget
    max_iterations: 1
  # Applies to each executed and evaluation task. The planner also stops by its
  # own rule.
  planning:
    _target_: able.structs.Budget
    max_wall_time: null
    max_iterations: null

eval_results_file: ${hydra:runtime.output_dir}/eval_results.csv
cycle_results_file: ${hydra:runtime.output_dir}/cycle_results.csv
config_file: ${hydra:runtime.output_dir}/config.yaml
# Videos of each stage of each cycle. Rendering happens outside timed sections.
record_videos: false
video_dir: ${hydra:runtime.output_dir}/videos
video_fps: 10
# Cycles to record, such as [0, 5, 10]. Null records every cycle.
video_cycles: null
approach_name: ${hydra:runtime.choices.approach}
env_name: ${hydra:runtime.choices.env}

defaults:
  - _self_
  - approach: dreaming
  - env: two_link_arm
  # The approach's factory for the environment, from env_approach/<env>/<approach>.yaml.
  - env_approach@approach: ${env}/${approach}
