_target_: able.approaches.make_limb_dreaming_robot
# Dreams imagine the same information gathering, task execution, and planning
# that the robot does between sleeping and evaluation.
gathering_budget: ${budgets.information_gathering}
execution_budget: ${budgets.execution}
planning_budget: ${budgets.planning}
# Training tasks planned under each training belief.
num_training_tasks: 1
# MPC candidates per step, and belief samples for the believed range of motion.
num_rollouts: 32
num_particles: 32
# The model that seeds MPC, refit once per sleep.
model:
  _target_: able.models.flow_matching.FlowMatchingModel
  num_steps: 4000
