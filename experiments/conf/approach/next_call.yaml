_target_: able.approaches.make_next_call_robot
# Dreams imagine the same information gathering, task execution, and planning
# that the robot does between sleeping and evaluation.
gathering_budget: ${budgets.information_gathering}
execution_budget: ${budgets.execution}
planning_budget: ${budgets.planning}
# Each sleep starts by dreaming this many beliefs, four per training belief with
# the default sleep budget, as many as the belief-coverage robot dreams. Smaller
# pools estimate the probabilities of the dreamed beliefs too coarsely.
num_candidates: 256
max_warm_starts_per_key: 4
