_target_: able.approaches.make_limb_belief_coverage_robot
# Each training belief is the farthest of this many dreams, so a sleep dreams
# this many times as often as the dreaming robot's.
num_candidates: 4
# Training tasks planned under each training belief.
num_training_tasks: 2
# MPC candidates per step, and belief samples for the believed range of motion.
num_rollouts: 32
num_particles: 32
# A step the model proposes is taken if it costs at most 1 + seed_tolerance times
# the best directed candidate.
seed_tolerance: 0.05
# The model that seeds MPC, refit once per sleep.
model:
  _target_: able.models.flow_matching.FlowMatchingModel
  num_steps: 4000
