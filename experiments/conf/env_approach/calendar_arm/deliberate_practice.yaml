_target_: able.approaches.make_calendar_allocation_robot
key_resolution: 0.03
awake_batch_size: 1
num_training_tasks: 1
training_iterations: 40
# Nights planned together.
horizon: 7
# Chance that a day goes well once every exercise has a plan within r steps of key
# resolution of the day's limits, for r = 1, 2, ..., as measured on this arm.
tier_values: [1.0, 0.82, 0.57, 0.29]
# Dreams per unit of the sleep, which estimate where the robot will plan.
dreams_per_unit: 16
# Deliberate Practice's day types are bins of this many steps of key resolution.
day_type_steps: 1
