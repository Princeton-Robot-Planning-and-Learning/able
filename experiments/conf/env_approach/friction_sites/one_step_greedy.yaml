_target_: able.approaches.make_friction_site_allocation_robot
num_units: ${budgets.sleep.max_iterations}
rule: one_step_greedy
# Candidate (site, belief) pairs dreamed per unit: each the belief after an
# imagined day (a probe and a task) at a site drawn by the schedule, focused on
# a site drawn the same way. A dream runs a whole POMCPOW episode, so few.
dreams_per_unit: 4
# A site's predicted gain rises linearly from ramp_passes[0] to ramp_passes[1]
# passes over its routine (a pass is routine_size / num_training_tasks units),
# and a unit counts fully toward sites on the same routine,
# shared_floor_transfer toward routines whose paths cross the same floors, and
# other_transfer toward the rest. Fit to the four-corridor transfer probe
# (experiments/analysis/fit_site_allocation.py): the trained site gained 0.06,
# 0.5, 0.9, and 1.0 of its saving after 1, 2, 4, and 8 units of an 8-task
# routine, and other corridors 0.18 effective units per unit.
# shared_floor_transfer is from the three-corridor probe, which had a site in
# the trained site's corridor. run_length is the cliff for a push cache.
run_length: 4
ramp_passes: [0.2, 0.8]
shared_floor_transfer: 0.55
other_transfer: 0.18
# Most POMCPOW simulations per push, and the search depth in pushes.
num_sims: 100
max_depth: 8
# A push's search may stop before num_sims: from min_sims on, every check_every
# simulations, it stops if the most visited push's lower confidence bound (z
# standard errors) is at least every other push's upper bound minus epsilon, or
# at least the value model's estimate for the root minus aspiration, where the
# model has enough data there.
early_stop:
  _target_: able.planners.pomcpow.EarlyStopConfig
  min_sims: 10
  check_every: 5
  epsilon: 1.0
  z: 2.0
  aspiration: 3.0
# Routine tasks each unit rolls out, so a group needs 4 units to cover a routine
# of 8.
num_training_tasks: 2
# Simulations per push when rolling out training tasks while sleeping.
training_num_sims: 100
# The model refits once per sleep on every rollout so far.
keep_only_last_sleep: false
# The model that proposes pushes, as for one friction site.
model:
  _target_: able.models.flow_matching.FlowMatchingModel
  width: 128
  depth: 3
  num_steps: 4000
# Corrects the leaf values with the returns of the rollouts while sleeping, by
# kernel regression on the distance and heading (cos, sin) to the goal, pushes
# left, the log of the believed friction along the straight route and its
# spread over its mean, and the puck's and goal's (x, y), with these bandwidths.
# Corridors run along x and lie 1.6 m apart in y, so a wide x bandwidth shares
# data along a corridor and a narrow y bandwidth keeps it from the others. Where
# the data are sparse, the correction falls back to zero (the path-distance
# value), not to the mean over all rollouts.
value_model:
  _target_: able.models.kernel_regression.KernelRegressor
  bandwidths: [0.75, 1.0, 1.0, 3.0, 0.35, 0.1, 2.0, 0.5, 2.0, 0.5]
  prior_weight: 4.0
  fallback: zero
value_features:
  _target_: able.planners.pomcpow.ValueFeatures
  position: true
  log_friction: true
