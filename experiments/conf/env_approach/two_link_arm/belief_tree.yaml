_target_: able.approaches.make_belief_tree_robot
# Dreams per sleep: belief coverage's 4 candidates per training belief.
num_expansions: 256
max_depth: 4
# Progressive widening: a node may have ceil(c * visits^a) children, where visits
# counts the expansions at or below it.
max_children: null
widening_constant: 1.0
widening_exponent: 0.7
# Ablations: m_n = 1 everywhere, and the initial cost model only.
use_leaf_counts: true
learn_cost_model: true
# Below 1, a belief "barely moved" if its cache key did not change.
stop_threshold: 0.5
wave_size: 8
init_radius: 1.0
max_warm_starts_per_key: 4
