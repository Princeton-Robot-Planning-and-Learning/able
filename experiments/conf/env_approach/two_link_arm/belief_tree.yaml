_target_: able.approaches.make_belief_tree_robot
# Dreams per sleep: belief coverage's 4 candidates per training belief.
num_expansions: 256
max_depth: 4
# Progressive widening: a node may have ceil(c * visits^a) children, where visits
# counts the expansions at or below it.
max_children: null
widening_constant: 1.0
widening_exponent: 0.7
# The plan cache only helps on an exact key match, so beliefs with the same key
# (distance below 1) are the same and all others are unlike.
match_threshold: 0.5
# Ablations: pick by each node's own score, m_n = 1 everywhere, and the initial
# cost model only.
use_facility_gain: true
use_leaf_counts: true
learn_cost_model: true
# Below 1, a belief "barely moved" if its cache key did not change.
stop_threshold: 0.5
# One dream at a time: a wave expands a node at most once, which would cap the
# root at one child per wave.
wave_size: 1
init_radius: 1.0
# What picks assume about later sleeps: "ancestors" counts each node's ancestors
# as trained; "dreaming" simulates each later sleep as dreaming over the node's
# children (later_sleep_budget of them, default the sleep budget), averaged over
# num_later_sleep_draws draws.
later_sleeps: dreaming
later_sleep_budget: null
num_later_sleep_draws: 8
# How the tree grows: "score" expands the nodes with the highest score(n);
# "value" (needs later_sleeps: dreaming) expands where a new child is worth the
# most to this sleep's picks, without progressive widening.
expansion: value
# Train under the current belief first, so the tree's dreams plan with that
# training, as the robot's next task does.
train_root_first: true
max_warm_starts_per_key: 4
