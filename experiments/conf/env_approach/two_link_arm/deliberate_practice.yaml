_target_: able.approaches.make_allocation_robot
# Dreams per unit of the sleep, which estimate where the robot will plan next, as
# many as belief coverage draws.
dreams_per_unit: 4
max_warm_starts_per_key: 4
# Steps of the cache key's resolution across which the cache lends plans, and the
# predicted transfer at each step (one entry per step, or null for full transfer).
max_key_distance: 0
transfer_by_distance: null
# Predicted share of a key's possible gain after one unit, and how the rest
# shrinks with each later unit.
first_unit_gain: 0.9
extra_unit_decay: 0.7
