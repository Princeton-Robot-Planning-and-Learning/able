_target_: able.approaches.make_human_reach_current_belief_robot
# Training scenes planned under each training belief.
num_training_tasks: 1
# PDDLStream's time limit per plan (s), the belief particles it plans under, and
# the chance a usable pose may be out of reach.
max_time: 600.0
num_particles: 256
delta: 0.02
# The most one solve may grow the process's memory (GB). A solve that grows more
# fails, rather than the run being killed for running out of memory.
max_memory_gb: 4.0
# The share of the time limit a try the model guides may use, so that a poor
# ranking leaves the fallback without the model time to plan (#132).
guided_time_fraction: 0.5
# The model that ranks placements, refit once per sleep.
model:
  _target_: able.models.flow_matching.FlowMatchingModel
  width: 128
  depth: 3
  num_steps: 2000
