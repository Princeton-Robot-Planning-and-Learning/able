_target_: able.approaches.make_multi_person_scratch_robot
# Plans cached per (goal, person's belief) key, lent to keys whose belief entries are
# within max_key_distance steps of resolution for the same goal.
model:
  _target_: able.models.exact_match_cache.ExactMatchCache
  max_per_key: 4
  max_key_distance: 6
  num_exact_dims: 2
num_proposals: 4
