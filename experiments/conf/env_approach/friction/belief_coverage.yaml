_target_: able.approaches.make_friction_belief_coverage_robot
# Each training belief is the farthest of this many dreams, so a sleep dreams
# this many times as often as the dreaming robot's.
num_candidates: 4
# Training tasks rolled out under each training belief.
num_training_tasks: 1
# POMCPOW simulations per push, and the search depth in pushes.
num_sims: 1000
max_depth: 8
# The model that proposes pushes, refit once per sleep.
model:
  _target_: able.models.flow_matching.FlowMatchingModel
  width: 128
  depth: 3
  num_steps: 2000
