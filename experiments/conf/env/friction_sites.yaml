# @package _global_
# Puck pushing at several sites with the same maze of four corridors. Sites in a
# group share each floor's friction level and run the same routine of pushing
# tasks, so what the robot learns at one site can serve the others in its group.
# Its approaches are in env_approach/friction_sites.
env:
  domain:
    _target_: able.envs.friction.sites.make_site_domain
    # Sites per group.
    group_sizes: [2, 3, 3, 4]
    # Tasks in each group's routine.
    routine_size: 8
    # Chance that each routine task is drawn from the whole maze instead of the
    # group's corridor: 0 keeps each group in its own corridor.
    region_overlap: 0.0
    # Chance that each group's routine is revised at the start of each new day.
    revision_rate: 0.0
    # Where a revised routine goes: its group's region (same), or another region
    # drawn uniformly (other).
    revision_region: same
    sim: 2d
    # The corridors maze, with num_holes holes in each corridor.
    maze: corridors4
    num_holes: 2
    goal_radius: 0.2
    horizon: 15
    task_distances: [1.5, 3.5]
    num_floors: 12
    num_particles: 500
    # The belief about each site starts from the prior, or knows the site's
    # group levels (levels).
    survey: prior
    # Sites share friction levels with their group (same), or the sites of each
    # group take the friction groups in turn (crossed), so a routine does not
    # tell its sites' frictions.
    friction_groups: same
    # Each friction group draws one base friction from base_levels, without
    # replacement; its floors are the base within floor_noise, and each site's
    # within site_jitter of its group's (base). Or each floor draws its own level
    # from the friction prior (per_floor).
    group_friction: base
    base_levels: [0.025, 0.05, 0.1, 0.2]
    floor_noise: 0.1
    site_jitter: 0.05
  renderer: null
budgets:
  sleep:
    max_iterations: 8
  # One probe a day at the day's site, on the floor whose standard deviation,
  # times how many of the site's routine tasks cross it, is largest.
  information_gathering:
    max_iterations: 1
  # As for one friction site: at most 15000 POMCPOW simulations per task.
  planning:
    max_wall_time: 600
    max_iterations: 15000
