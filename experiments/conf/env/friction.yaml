# @package _global_
env:
  domain:
    _target_: able.envs.friction.tasks.make_domain
    # The simulator: 2d (PyMunk) or 3d (PyBullet, TidyBot).
    sim: 2d
    # Holes in the maze, added in a fixed order (0 to 9), and the goal's radius (m).
    num_holes: 4
    goal_radius: 0.3
    # Pushes per episode.
    horizon: 15
    num_particles: 500
  # Instantiated with the domain's environment model, only when recording videos.
  renderer:
    _target_: able.rendering.friction.FrictionRenderer
# A training rollout at 100 simulations per push takes several seconds, so dream
# less than on the arm. 8 evaluation tasks per cycle keep the per-cycle success
# rate steady; with num_workers, they run at once.
num_eval_tasks: 8
budgets:
  sleep:
    max_iterations: 4
  # Planning stops after 15000 POMCPOW simulations per task (iterations), which
  # caps the planner's work the same way on any machine and under any load. That
  # is 15 pushes (the horizon) of 1000 simulations, so it binds only at 1000 or
  # more simulations per push, where a model-guided search that finds no push and
  # falls back costs later pushes simulations. The 10 minutes guard against a slow
  # machine. Running out of either counts as a timeout.
  planning:
    max_wall_time: 600
    max_iterations: 15000
