# @package _global_
env:
  domain:
    _target_: able.envs.human_reach.tasks.make_domain
    # Requested items to deliver, and clutter on the bedside.
    num_requested: 2
    num_clutter: 5
    # Actions per episode: each is one move_base, pick, or place. Scenes that need
    # clutter moved off the few usable spots take longer plans.
    horizon: 60
    num_particles: 2000
  # Instantiated with the domain's environment model, only when recording videos.
  renderer:
    _target_: able.rendering.human_reach.HumanReachRenderer
# Planning a human reach task takes minutes, so dream less than on the arm. 8
# evaluation tasks per cycle keep the per-cycle means steady; with num_workers,
# they run at once.
num_eval_tasks: 8
budgets:
  sleep:
    max_iterations: 4
  # Planning stops after 5000 stream evaluations per task (iterations), which
  # caps the planner's work the same way on any machine and under any load. In
  # calibration a stream evaluation took about 0.04 s, so 5000 is about 3.5
  # minutes; the 10 minutes (with approach.max_time) only guard against a search
  # that runs long without evaluating streams. Both are shared with the retry
  # without the model when a seeded plan fails. Running out of either counts as a
  # timeout.
  planning:
    max_wall_time: 600
    max_iterations: 5000
