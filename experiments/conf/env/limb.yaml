# @package _global_
env:
  domain:
    _target_: able.envs.limb.tasks.make_domain
    # One of {isolated, human, bed, wheelchair}-{left, right}-{arm, leg}.
    variant: human-left-arm
    # Control steps per episode; each lasts 12 simulator steps.
    horizon: 300
    # Joint-space distance between start and goal (rad). Planning from scratch
    # under the prior takes 50-250 s per task in this band.
    min_separation: 0.5
    max_separation: 0.8
  # Instantiated with the domain's environment model, only when recording videos.
  renderer:
    _target_: able.rendering.limb.LimbRenderer
# Planning a limb task takes minutes, so dream less than on the arm. 8 evaluation
# tasks per cycle keep the per-cycle means steady; with num_workers, they run at
# once.
num_eval_tasks: 8
budgets:
  sleep:
    max_iterations: 4
