# @package _global_
env:
  domain:
    _target_: able.envs.limb.tasks.make_domain
    # One of {isolated, human, bed, wheelchair}-{left, right}-{arm, leg}.
    variant: human-left-arm
    # Control steps per episode; each lasts 12 simulator steps.
    horizon: 300
    # Joint-space distance between start and goal (rad). Planning from scratch
    # under the prior takes 50-250 s per task in this band.
    min_separation: 0.5
    max_separation: 0.8
  # Instantiated with the domain's environment model, only when recording videos.
  renderer:
    _target_: able.rendering.limb.LimbRenderer
# Planning a limb task takes minutes, so dream less than on the arm. 8 evaluation
# tasks per cycle keep the per-cycle means steady; with num_workers, they run at
# once.
num_eval_tasks: 8
budgets:
  sleep:
    max_iterations: 4
  # Planning stops after 2000 MPC rollouts per task (iterations), which caps the
  # planner's work the same way on any machine and under any load. Without a
  # limit, planning from scratch took 1990 rollouts per task on average, and a
  # rollout took about 0.12 s on Della, so 2000 is about 4 minutes; the 10 minutes
  # only guard against a slow machine. Both are shared with the retry without the
  # model when a seeded plan fails, and apply to the plans the robots learn from
  # while they sleep. Running out of either counts as a timeout.
  planning:
    max_wall_time: 600
    max_iterations: 2000
