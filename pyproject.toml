[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "able"
version = "0.1.0"
description = "Anticipating belief updates."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
   "hydra-core",
   "imageio",
   "imageio-ffmpeg",
   "matplotlib",
   "numpy",
   "omegaconf",
   "pandas",
   "torch",
]

[project.optional-dependencies]
# The limb repositioning environment (PyBullet).
limb = [
    "kindergarden @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kindergarden.git@3f57bb6e07f89f8701e6b86410c773860ea9db2d",
    "pybullet_helpers>=0.1.0",
    "scipy",
]
# The friction environment (PyMunk in 2D, PyBullet in 3D).
friction = [
    "kindergarden @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kindergarden.git@3f57bb6e07f89f8701e6b86410c773860ea9db2d",
    "pybullet_helpers>=0.1.0",
    "scipy",
]
# The human reach environment (PyBullet, PDDLStream).
human_reach = [
    "kindergarden @ git+https://github.com/Princeton-Robot-Planning-and-Learning/kindergarden.git@3f57bb6e07f89f8701e6b86410c773860ea9db2d",
    "pddlstream @ git+https://github.com/Princeton-Robot-Planning-and-Learning/pddlstream.git@5919a844b8c947acdb49bedb6e8b2b93e6a70c0c",
    "pybullet_helpers>=0.1.0",
]
# Runs experiments as Slurm jobs (hydra/launcher=della).
slurm = [
    "hydra-submitit-launcher",
]
develop = [
    "black",
    "docformatter",
    "isort",
    "mypy",
    "pandas-stubs",
    "pylint>=2.14.5",
    "pytest-pylint>=0.18.0",
    "pytest>=7.2.2,<9",
    "pytest-xdist",
]

# CPU wheels keep CI installs small. Only uv reads this; pip users can pass
# --index-url https://download.pytorch.org/whl/cpu to get the same wheels.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
able = ["py.typed", "envs/limb/*.json", "envs/human_reach/pddl/*.pddl"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
py_version = 311
profile = "black"
multi_line_output = 2
skip_glob = ["venv/*", ".venv/*"]
split_on_trailing_comma = true

[tool.docformatter]
line-length = 88
wrap-summaries = 88
wrap-descriptions = 88

[tool.mypy]
strict_equality = true
disallow_untyped_calls = true
warn_unreachable = true
exclude = ["venv/*", ".venv/*"]

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "pddlstream.*",
    "pybullet.*",
    "scipy.*",
]
ignore_missing_imports = true
